name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # to attach the disk image to a release
    steps:
      - uses: actions/checkout@v5
      - run: cargo test
      - run: ./build.sh release
      # A tag vX.Y.Z drafts a release with the disk image, to be checked and published by hand.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "the tag does not match the version in Cargo.toml"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/Keycaps.dmg --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
